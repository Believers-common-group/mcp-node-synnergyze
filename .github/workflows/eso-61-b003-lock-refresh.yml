name: ESO-61 B003 lock refresh

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/eso-61-b003-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/eso-61-b003-license-metadata'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Regenerate lock metadata without scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify MIT root metadata
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.license !== 'MIT') throw new Error(`package.json license is ${pkg.license}`);
          if (lock.packages?.['']?.license !== 'MIT') throw new Error(`package-lock root license is ${lock.packages?.['']?.license}`);
          NODE

      - name: Commit generated lock if needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already aligned'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(ESO-61): refresh lock licence metadata'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
