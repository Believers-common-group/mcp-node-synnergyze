name: B-010 repair site handoff type integration

on:
  push:
    branches:
      - fix/b010-governed-site-handoff-v2
    paths:
      - .github/workflows/b010-repair-site-handoff-types.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/b010-governed-site-handoff-v2
          fetch-depth: 0

      - name: Replace legacy role/type coupling with governed v2 contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('site-handoff/governed-runtime.ts')
          text = path.read_text()
          old_import = '''import {
            authorizeBackGate,
            authorizeFrontGate,
            type HandoffClaims,
            type Site,
          } from "./runtime.ts";

          '''
          if old_import not in text:
              raise SystemExit('expected legacy import block not found')
          text = text.replace(old_import, 'export type Site = "BC" | "CC" | "VSR";\n\n', 1)

          old_claims = '''export interface HandoffClaimsV2 extends HandoffClaims {
            ver: typeof TOKEN_VERSION;
            handoff_ref: string;
            warden_decision_ref: string;
            warden_evidence_ref: string;
          }
          '''
          new_claims = '''export interface HandoffClaimsV2 {
            ver: typeof TOKEN_VERSION;
            iss: string;
            aud: Site;
            iat: number;
            exp: number;
            jti: string;
            nonce: string;
            src: Site;
            dst: Site;
            digitalme_id: string;
            actor_id: string;
            warden_grant_id: string;
            capabilities: readonly string[];
            handoff_ref: string;
            warden_decision_ref: string;
            warden_evidence_ref: string;
          }
          '''
          if old_claims not in text:
              raise SystemExit('expected HandoffClaimsV2 inheritance block not found')
          text = text.replace(old_claims, new_claims, 1)

          old_roles = '''function rolesForDestination(claims: HandoffClaimsV2): string[] {
            if (claims.dst === "VSR") return authorizeFrontGate(claims).roles;
            return authorizeBackGate(claims).roles;
          }
          '''
          new_roles = '''function rolesForDestination(claims: HandoffClaimsV2): string[] {
            const prefix = claims.dst;
            const roles = new Set<string>();
            for (const capability of claims.capabilities) {
              if (capability === "program:read") roles.add(`${prefix}_VIEWER`);
              if (capability === "evidence:submit") roles.add(`${prefix}_EVIDENCE_CONTRIBUTOR`);
            }
            if (roles.size === 0) throw new Error("handoff_destination_role_mapping_missing");
            return [...roles].sort();
          }
          '''
          if old_roles not in text:
              raise SystemExit('expected legacy rolesForDestination block not found')
          text = text.replace(old_roles, new_roles, 1)
          path.write_text(text)

          tsconfig = Path('tsconfig.json')
          config = tsconfig.read_text()
          needle = '    "agent-fabric/**/*.ts",\n    "modules/**/*.ts"'
          replacement = '    "agent-fabric/**/*.ts",\n    "site-handoff/**/*.ts",\n    "modules/**/*.ts"'
          if needle not in config:
              raise SystemExit('expected tsconfig include block not found')
          tsconfig.write_text(config.replace(needle, replacement, 1))
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-handoff/governed-runtime.ts tsconfig.json
          git commit -m 'Type-check governed site handoff and remove legacy role coupling'
          git push origin HEAD:fix/b010-governed-site-handoff-v2
