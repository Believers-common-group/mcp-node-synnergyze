name: B-009 update Inspector lock

on:
  push:
    branches:
      - fix/b009-dev-security-baseline
    paths:
      - package.json
      - .github/workflows/b009-update-inspector-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/b009-dev-security-baseline
          fetch-depth: 0

      - name: Use governed Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Update only Inspector dependency in lock
        run: npm install --save-dev --package-lock-only --ignore-scripts --no-audit --no-fund '@modelcontextprotocol/inspector@^1.0.1'

      - name: Verify patched Inspector and full audit
        shell: bash
        run: |
          npm ci --ignore-scripts
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.devDependencies?.['@modelcontextprotocol/inspector'] !== '^1.0.1') {
            throw new Error('package manifest Inspector range drifted');
          }
          const resolved = lock.packages?.['node_modules/@modelcontextprotocol/inspector']?.version;
          if (!resolved) throw new Error('Inspector is missing from package-lock');
          const [major, minor, patch] = resolved.split('.').map(Number);
          if (major < 1 && (minor < 16 || (minor === 16 && patch < 6))) {
            throw new Error(`Inspector remains vulnerable at ${resolved}`);
          }
          console.log(`INSPECTOR_RESOLVED=${resolved}`);
          NODE
          npm audit --audit-level=high

      - name: Smoke Inspector CLI
        shell: bash
        run: timeout 15s npx --no-install mcp-inspector --help >/tmp/inspector-help.txt 2>&1 || status=$?; if [[ ${status:-0} -ne 0 && ${status:-0} -ne 124 ]]; then cat /tmp/inspector-help.txt; exit ${status}; fi; head -40 /tmp/inspector-help.txt || true

      - name: Commit generated lock if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Lock patched MCP Inspector dev dependency'
          git push origin HEAD:fix/b009-dev-security-baseline
