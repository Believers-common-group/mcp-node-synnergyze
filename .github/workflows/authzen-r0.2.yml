name: AuthZEN R0.2

on:
  pull_request:
    paths:
      - "api/authzen-cert.ts"
      - "api/authzen-cert.test.ts"
      - "modules/warden/authzen-*.ts"
      - "scripts/run-authzen-authorization-api-1_0-scenario.mjs"
      - "scripts/serve-authzen-certification-fixture.mjs"
      - "vercel.json"
      - ".github/workflows/authzen-r0.2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-authzen-r0-2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm i

      - name: Type check repository
        run: npm run -s type-check

      - name: Lint AuthZEN slice
        run: >-
          npx eslint --quiet
          api/authzen-cert.ts
          api/authzen-cert.test.ts
          modules/warden/authzen-profile.ts
          modules/warden/authzen-profile.test.ts
          modules/warden/authzen-http.ts
          modules/warden/authzen-http.test.ts
          modules/warden/authzen-certification-fixture.ts
          modules/warden/authzen-certification-fixture.test.ts
          modules/warden/authzen-certification-batch-search.test.ts

      - name: Verify black-box helper syntax
        run: |
          node --check scripts/run-authzen-authorization-api-1_0-scenario.mjs
          node --check scripts/serve-authzen-certification-fixture.mjs

      - name: Run AuthZEN tests
        run: >-
          npx vitest run
          api/authzen-cert.test.ts
          modules/warden/authzen-profile.test.ts
          modules/warden/authzen-http.test.ts
          modules/warden/authzen-certification-fixture.test.ts
          modules/warden/authzen-certification-batch-search.test.ts

      - name: Run black-box Authorization API 1.0 scenario
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --no-warnings=ExperimentalWarnings \
            scripts/serve-authzen-certification-fixture.mjs \
            > /tmp/authzen-cert-fixture.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:4010/.well-known/authzen-configuration \
              >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/authzen-cert-fixture.log
            exit 1
          fi

          AUTHZEN_CERT_BASE_URL=http://127.0.0.1:4010 \
          AUTHZEN_CERT_ALLOW_HTTP=1 \
            node scripts/run-authzen-authorization-api-1_0-scenario.mjs
