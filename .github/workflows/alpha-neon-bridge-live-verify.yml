name: alpha-neon-bridge-live-verify

on:
  push:
    branches: [genesis]
    paths:
      - .github/workflows/alpha-neon-bridge-live-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REGISTRY_BRIDGE_SECRET: ${{ secrets.REGISTRY_BRIDGE_SECRET }}
    steps:
      - name: Verify Genesis persistence status
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/mcp'
          payload='{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"genesis_status","arguments":{}}}'
          tmp=$(mktemp)
          for i in {1..12}; do
            code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "$endpoint" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-03-26' --data "$payload" || true)
            if [ "$code" = '200' ]; then break; fi
            sleep 5
          done
          test "$code" = '200'
          text=$(jq -r '.result.content[]? | select(.type=="text") | .text' "$tmp" | head -n1)
          printf '%s\n' "$text" | jq '{runtimeState,authorityBoundary,neonProjection,bridgeState}'
          printf '%s' "$text" | jq -e '.runtimeState == "operational" and .authorityBoundary.canonicalState == "ALPHA-NODE-001 local Registry" and .authorityBoundary.policyAuthority == "Warden"' >/dev/null
          echo 'genesis_persistence_status=PASS'

      - name: Verify Neon projection diagnostic
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/mcp'
          payload='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"genesis_neon_projection_probe","arguments":{}}}'
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "$endpoint" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-03-26' --data "$payload")
          test "$code" = '200'
          text=$(jq -r '.result.content[]? | select(.type=="text") | .text' "$tmp" | head -n1)
          printf '%s\n' "$text" | jq .
          printf '%s' "$text" | jq -e '(.mode == "vercel_direct_bridge" and .ok == true and .bridgeReady == true) or (.mode == "connector_managed_external" and .directProbeSkipped == true and .runtimeBlocking == false)' >/dev/null
          echo 'neon_projection_diagnostic=PASS'

      - name: Verify Registry bridge default deny
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/registry-bridge?limit=1'
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' "$endpoint" -H 'Authorization: Bearer deliberately-wrong-alpha-verification-token')
          test "$code" = '401'
          jq -e '.ok == false and .error == "unauthorized"' "$tmp" >/dev/null
          echo 'registry_bridge_default_deny=PASS'

      - name: Verify authorized zero-mutation bridge acceptance
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY_BRIDGE_SECRET:-}" ]; then
            echo 'registry_bridge_secret_present=false'
            exit 3
          fi
          endpoint='https://synnergyze-genesis-mcp.vercel.app/registry-bridge?limit=1'
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' "$endpoint" -H "Authorization: Bearer $REGISTRY_BRIDGE_SECRET")
          echo "authorized_bridge_http=$code"
          jq . "$tmp"
          test "$code" = '200'
          jq -e '.ok == true and .bridge == "GEN-PART-PG-BRIDGE-003" and .source == "CWR-REGISTRY" and .scanned == 0 and .delivered == 0 and .failed == 0' "$tmp" >/dev/null
          echo 'authorized_zero_mutation_bridge=PASS'
