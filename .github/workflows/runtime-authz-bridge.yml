name: Runtime AuthZ Bridge

on:
  push:
    branches:
      - genesis
      - gcs002-producer-signing
    paths:
      - 'modules/warden/runtime-authz-bridge.ts'
      - 'modules/warden/runtime-authz-bridge.test.ts'
      - 'modules/warden/runtime-authz-signed-export.ts'
      - 'modules/warden/runtime-authz-signed-export.test.ts'
      - 'modules/warden/producer-signature.ts'
      - 'modules/warden/decision-service.ts'
      - 'modules/warden/contracts.ts'
      - '.github/workflows/runtime-authz-bridge.yml'
  pull_request:
    branches:
      - genesis
    paths:
      - 'modules/warden/runtime-authz-bridge.ts'
      - 'modules/warden/runtime-authz-bridge.test.ts'
      - 'modules/warden/runtime-authz-signed-export.ts'
      - 'modules/warden/runtime-authz-signed-export.test.ts'
      - 'modules/warden/producer-signature.ts'
      - 'modules/warden/decision-service.ts'
      - 'modules/warden/contracts.ts'
      - '.github/workflows/runtime-authz-bridge.yml'

permissions:
  contents: read

jobs:
  runtime-authz-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Existing Warden decision suite
        run: npm run test:warden-decision -- --run
      - name: Runtime AuthZ bridge suite
        env:
          RUNTIME_AUTHZ_FIXTURE_DIR: runtime-authz-fixture
        run: npx vitest run modules/warden/runtime-authz-bridge.test.ts modules/warden/runtime-authz-signed-export.test.ts
      - name: Upload signed Warden fixture
        uses: actions/upload-artifact@v4
        with:
          name: warden-runtime-authz-fixture
          path: runtime-authz-fixture
          if-no-files-found: error
