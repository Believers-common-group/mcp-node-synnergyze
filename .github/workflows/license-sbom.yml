name: licence-sbom

on:
  pull_request:
    branches: [genesis]
    paths:
      - package.json
      - package-lock.json
      - LICENSE
      - README.md
      - rights/release-rights.json
      - .github/workflows/license-sbom.yml
  push:
    branches: [genesis]
    paths:
      - package.json
      - package-lock.json
      - LICENSE
      - README.md
      - rights/release-rights.json
      - .github/workflows/license-sbom.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use governed Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Verify root licence, rights state and lock metadata
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const rights = require('./rights/release-rights.json');

          if (pkg.license !== 'MIT') throw new Error(`package.json license is ${pkg.license}`);
          if (lock.packages?.['']?.license !== 'MIT') throw new Error(`package-lock root license is ${lock.packages?.['']?.license}`);

          const root = lock.packages?.[''];
          for (const section of ['dependencies', 'devDependencies']) {
            const manifestDeps = pkg[section] || {};
            const lockedDeps = root?.[section] || {};
            if (JSON.stringify(manifestDeps) !== JSON.stringify(lockedDeps)) {
              throw new Error(`${section} drift between package.json and package-lock.json`);
            }
          }

          const licence = fs.readFileSync('LICENSE');
          const licenceSha256 = crypto.createHash('sha256').update(licence).digest('hex');
          if (!licence.toString('utf8').startsWith('MIT License\n')) {
            throw new Error('root LICENSE is not MIT text');
          }

          if (rights.status !== 'CLEARED') {
            throw new Error(`release rights status is ${rights.status}; Warden/Launchpad admission remains blocked`);
          }
          if (rights.governance?.status !== 'CLEARED') {
            throw new Error(`governance rights decision is ${rights.governance?.status ?? 'missing'}`);
          }
          if (!rights.clearance?.decision_reference || !rights.clearance?.deciding_principal || !rights.clearance?.authority_basis || !rights.clearance?.cleared_at) {
            throw new Error('rights clearance evidence is incomplete');
          }
          if (rights.license_text_sha256 && rights.license_text_sha256 !== licenceSha256) {
            throw new Error('root LICENSE digest differs from governed licence-text digest');
          }
          if (!['NOT_REQUIRED', 'EVIDENCED'].includes(rights.platform?.status)) {
            throw new Error(`Launchpad platform permission is ${rights.platform?.status ?? 'missing'}`);
          }

          console.log(`root LICENSE sha256: ${licenceSha256}`);
          console.log(`rights decision: ${rights.clearance.decision_reference}`);
          NODE

      - name: Install exact locked dependency graph
        run: npm ci --ignore-scripts

      - name: Generate CycloneDX SBOM
        run: |
          npm sbom --sbom-format cyclonedx > /tmp/npm-sbom.cdx.json
          node - <<'NODE'
          const fs = require('fs');
          const sbom = JSON.parse(fs.readFileSync('/tmp/npm-sbom.cdx.json', 'utf8'));
          if (!Array.isArray(sbom.components) || sbom.components.length === 0) {
            throw new Error('CycloneDX SBOM contains no dependency components');
          }
          console.log(`CycloneDX components: ${sbom.components.length}`);
          NODE
          sha256sum /tmp/npm-sbom.cdx.json

      - name: Emit dependency licence inventory
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const lock = require('./package-lock.json');
          const inventory = [];
          for (const [path] of Object.entries(lock.packages || {})) {
            if (!path.startsWith('node_modules/')) continue;
            const manifestPath = `${path}/package.json`;
            if (!fs.existsSync(manifestPath)) continue;
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            inventory.push({
              name: manifest.name,
              version: manifest.version,
              license: manifest.license ?? manifest.licenses ?? 'UNDECLARED'
            });
          }
          inventory.sort((a, b) => `${a.name}@${a.version}`.localeCompare(`${b.name}@${b.version}`));
          const undeclared = inventory.filter(item => item.license === 'UNDECLARED');
          console.log(`Dependency packages inventoried: ${inventory.length}`);
          if (undeclared.length) {
            console.error('Undeclared dependency licences:', undeclared);
            process.exit(1);
          }
          NODE
