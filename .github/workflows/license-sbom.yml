name: licence-sbom

on:
  pull_request:
    branches: [genesis]
    paths:
      - package.json
      - package-lock.json
      - LICENSE
      - README.md
      - rights/release-rights.json
      - .github/workflows/license-sbom.yml
  push:
    branches: [genesis]
    paths:
      - package.json
      - package-lock.json
      - LICENSE
      - README.md
      - rights/release-rights.json
      - .github/workflows/license-sbom.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use governed Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Prepare evidence directory
        run: mkdir -p evidence

      - name: Verify root licence shape and lock metadata
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');

          if (pkg.license !== 'MIT') throw new Error(`package.json license is ${pkg.license}`);
          if (lock.packages?.['']?.license !== 'MIT') throw new Error(`package-lock root license is ${lock.packages?.['']?.license}`);

          const root = lock.packages?.[''];
          for (const section of ['dependencies', 'devDependencies']) {
            const manifestDeps = pkg[section] || {};
            const lockedDeps = root?.[section] || {};
            if (JSON.stringify(manifestDeps) !== JSON.stringify(lockedDeps)) {
              throw new Error(`${section} drift between package.json and package-lock.json`);
            }
          }

          const licence = fs.readFileSync('LICENSE', 'utf8');
          if (!licence.startsWith('MIT License\n')) {
            throw new Error('root LICENSE is not MIT text');
          }
          NODE
          sha256sum package.json package-lock.json LICENSE rights/release-rights.json > evidence/source-metadata.sha256

      - name: Install exact locked dependency graph
        run: npm ci --ignore-scripts

      - name: Generate npm CycloneDX SBOM
        run: |
          npm sbom --sbom-format cyclonedx > evidence/npm-sbom.cdx.json
          node - <<'NODE'
          const fs = require('fs');
          const sbom = JSON.parse(fs.readFileSync('evidence/npm-sbom.cdx.json', 'utf8'));
          if (!Array.isArray(sbom.components) || sbom.components.length === 0) {
            throw new Error('CycloneDX SBOM contains no dependency components');
          }
          console.log(`CycloneDX components: ${sbom.components.length}`);
          NODE
          sha256sum evidence/npm-sbom.cdx.json > evidence/npm-sbom.cdx.sha256

      - name: Download governed Syft
        id: syft
        uses: anchore/sbom-action/download-syft@6b92ff5b2cce1787a99198f282dd8a26d1991449
        with:
          syft-version: v1.42.3

      - name: Generate Syft and SPDX evidence
        run: |
          "${{ steps.syft.outputs.cmd }}" dir:. \
            -o syft-json=evidence/sbom.syft.json \
            -o spdx-json=evidence/sbom.spdx.json
          sha256sum evidence/sbom.syft.json evidence/sbom.spdx.json > evidence/sbom.sha256

      - name: Emit dependency licence inventory
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const lock = require('./package-lock.json');
          const inventory = [];
          for (const [path] of Object.entries(lock.packages || {})) {
            if (!path.startsWith('node_modules/')) continue;
            const manifestPath = `${path}/package.json`;
            if (!fs.existsSync(manifestPath)) continue;
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            inventory.push({
              name: manifest.name,
              version: manifest.version,
              license: manifest.license ?? manifest.licenses ?? 'UNDECLARED'
            });
          }
          inventory.sort((a, b) => `${a.name}@${a.version}`.localeCompare(`${b.name}@${b.version}`));
          fs.writeFileSync('evidence/dependency-licenses.json', JSON.stringify(inventory, null, 2));
          const undeclared = inventory.filter(item => item.license === 'UNDECLARED');
          console.log(`Dependency packages inventoried: ${inventory.length}`);
          if (undeclared.length) {
            console.error('Undeclared dependency licences:', undeclared);
            process.exit(1);
          }
          NODE
          sha256sum evidence/dependency-licenses.json > evidence/dependency-licenses.sha256

      - name: Capture exact source identity
        run: |
          git rev-parse HEAD | tee evidence/source-commit.txt
          printf '%s\n' "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" > evidence/source-branch.txt
          cp rights/release-rights.json evidence/release-rights.json

      - name: Capture commit-author lineage evidence
        run: |
          git log --format='%H%x09%an%x09%ae%x09%aI' > evidence/commit-authors.tsv
          node - <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('evidence/commit-authors.tsv', 'utf8').trim().split('\n').filter(Boolean);
          const authors = new Map();
          for (const line of lines) {
            const [commit, name, email, authoredAt] = line.split('\t');
            const key = `${name}\u0000${email}`;
            const current = authors.get(key) ?? {
              name,
              email,
              commits: 0,
              first_authored_at: authoredAt,
              last_authored_at: authoredAt,
              classification: email.toLowerCase().endsWith('@algolia.com')
                ? 'OBSERVED_UPSTREAM_ALGOLIA_AUTHOR'
                : 'OBSERVED_NON_ALGOLIA_AUTHOR_REVIEW_REQUIRED'
            };
            current.commits += 1;
            if (authoredAt < current.first_authored_at) current.first_authored_at = authoredAt;
            if (authoredAt > current.last_authored_at) current.last_authored_at = authoredAt;
            authors.set(key, current);
          }
          const inventory = {
            schema: 'VSR_GIT_AUTHOR_LINEAGE_EVIDENCE/1.0',
            classification: 'OBSERVED_GIT_AUTHORSHIP_NOT_COPYRIGHT_OWNERSHIP',
            commit_count: lines.length,
            author_count: authors.size,
            authors: [...authors.values()].sort((a, b) => b.commits - a.commits || a.email.localeCompare(b.email))
          };
          fs.writeFileSync('evidence/git-author-lineage.json', JSON.stringify(inventory, null, 2));
          console.log(`Git author lineage: ${inventory.commit_count} commits / ${inventory.author_count} observed author identities`);
          NODE
          sha256sum evidence/commit-authors.tsv evidence/git-author-lineage.json > evidence/git-author-lineage.sha256

      - name: Upload rights evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rights-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce governed release admission
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const rights = require('./rights/release-rights.json');
          const licence = fs.readFileSync('LICENSE');
          const licenceSha256 = crypto.createHash('sha256').update(licence).digest('hex');

          if (rights.status !== 'CLEARED') {
            throw new Error(`release rights status is ${rights.status}; Warden/Launchpad admission remains blocked`);
          }
          if (rights.governance?.status !== 'CLEARED') {
            throw new Error(`governance rights decision is ${rights.governance?.status ?? 'missing'}`);
          }
          if (!rights.clearance?.decision_reference || !rights.clearance?.deciding_principal || !rights.clearance?.authority_basis || !rights.clearance?.cleared_at) {
            throw new Error('rights clearance evidence is incomplete');
          }
          if (!rights.license_text_sha256) {
            throw new Error('governed licence-text digest is missing');
          }
          if (rights.license_text_sha256 !== licenceSha256) {
            throw new Error('root LICENSE digest differs from governed licence-text digest');
          }
          if (!['NOT_REQUIRED', 'EVIDENCED'].includes(rights.platform?.status)) {
            throw new Error(`Launchpad platform permission is ${rights.platform?.status ?? 'missing'}`);
          }

          console.log(`root LICENSE sha256: ${licenceSha256}`);
          console.log(`rights decision: ${rights.clearance.decision_reference}`);
          NODE
