name: licence-sbom

on:
  pull_request:
    branches: [genesis]
    paths:
      - package.json
      - package-lock.json
      - LICENSE
      - README.md
      - .github/workflows/license-sbom.yml
  push:
    branches: [genesis]
    paths:
      - package.json
      - package-lock.json
      - LICENSE
      - README.md
      - .github/workflows/license-sbom.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      ASSURANCE_DIR: ${{ runner.temp }}/licence-sbom-assurance
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use governed Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Verify root licence and lock metadata
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.license !== 'MIT') throw new Error(`package.json license is ${pkg.license}`);
          if (lock.packages?.['']?.license !== 'MIT') throw new Error(`package-lock root license is ${lock.packages?.['']?.license}`);
          const root = lock.packages?.[''];
          for (const section of ['dependencies', 'devDependencies']) {
            const manifestDeps = pkg[section] || {};
            const lockedDeps = root?.[section] || {};
            if (JSON.stringify(manifestDeps) !== JSON.stringify(lockedDeps)) {
              throw new Error(`${section} drift between package.json and package-lock.json`);
            }
          }
          NODE
          grep -q '^MIT License$' LICENSE

      - name: Install exact locked dependency graph
        run: npm ci --ignore-scripts

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p "$ASSURANCE_DIR"
          npm sbom --sbom-format cyclonedx > "$ASSURANCE_DIR/npm-sbom.cdx.json"
          node - <<'NODE'
          const fs = require('fs');
          const path = `${process.env.ASSURANCE_DIR}/npm-sbom.cdx.json`;
          const sbom = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!Array.isArray(sbom.components) || sbom.components.length === 0) {
            throw new Error('CycloneDX SBOM contains no dependency components');
          }
          console.log(`CycloneDX components: ${sbom.components.length}`);
          NODE
          sha256sum "$ASSURANCE_DIR/npm-sbom.cdx.json" | tee "$ASSURANCE_DIR/npm-sbom.cdx.sha256"

      - name: Generate dependency licence inventory
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const lock = require('./package-lock.json');
          const inventory = [];
          for (const [path] of Object.entries(lock.packages || {})) {
            if (!path.startsWith('node_modules/')) continue;
            const manifestPath = `${path}/package.json`;
            if (!fs.existsSync(manifestPath)) continue;
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            inventory.push({
              name: manifest.name,
              version: manifest.version,
              license: manifest.license ?? manifest.licenses ?? 'UNDECLARED'
            });
          }
          inventory.sort((a, b) => `${a.name}@${a.version}`.localeCompare(`${b.name}@${b.version}`));
          const undeclared = inventory.filter(item => item.license === 'UNDECLARED');
          fs.writeFileSync(
            `${process.env.ASSURANCE_DIR}/dependency-licences.json`,
            JSON.stringify({ generatedAt: new Date().toISOString(), packages: inventory }, null, 2)
          );
          console.log(`Dependency packages inventoried: ${inventory.length}`);
          if (undeclared.length) {
            console.error('Undeclared dependency licences:', undeclared);
            process.exit(1);
          }
          NODE
          sha256sum "$ASSURANCE_DIR/dependency-licences.json" | tee "$ASSURANCE_DIR/dependency-licences.sha256"

      - name: Retain licence and SBOM assurance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: licence-sbom-${{ github.sha }}
          path: ${{ env.ASSURANCE_DIR }}
          if-no-files-found: error
          retention-days: 30
