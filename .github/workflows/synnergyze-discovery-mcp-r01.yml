name: Synnergyze Discovery MCP R0.1 — stdio-only

on:
  pull_request:
    paths:
      - 'apps/synnergyze-discovery-mcp-r01/**'
      - '.github/workflows/synnergyze-discovery-mcp-r01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install exact repository dependencies
        run: npm ci --ignore-scripts
      - name: Parse discovery server and smoke test
        run: |
          node --check apps/synnergyze-discovery-mcp-r01/server.mjs
          node --check apps/synnergyze-discovery-mcp-r01/discovery.node-check.mjs
      - name: Verify actual MCP stdio protocol and denied mutation
        run: node --test apps/synnergyze-discovery-mcp-r01/discovery.node-check.mjs
      - name: Validate isolated Synnergyze package contents
        run: |
          npm pack ./apps/synnergyze-discovery-mcp-r01 --dry-run --ignore-scripts --json > "$RUNNER_TEMP/synnergyze-pack.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const archive = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/synnergyze-pack.json', 'utf8'))[0];
          const actual = archive.files.map(f => f.path).sort();
          const expected = ['README.md', 'package.json', 'server.mjs'].sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error('Unexpected package contents: ' + JSON.stringify(actual));
          }
          const meta = JSON.parse(readFileSync('apps/synnergyze-discovery-mcp-r01/package.json', 'utf8'));
          if (meta.private !== true || meta.name !== '@believers-common-group/synnergyze-discovery-mcp') {
            throw new Error('Unauthorized or misidentified release candidate');
          }
          if ('algoliasearch' in meta.dependencies) {
            throw new Error('Algolia inherited dependency found in standalone package');
          }
          NODE
      - name: Install only the Synnergyze tarball and verify MCP protocol
        shell: bash
        run: |
          ARCHIVE="$(npm pack ./apps/synnergyze-discovery-mcp-r01 --pack-destination "$RUNNER_TEMP" --ignore-scripts)"
          mkdir -p "$RUNNER_TEMP/isolated-synnergyze"
          npm install --prefix "$RUNNER_TEMP/isolated-synnergyze" "$RUNNER_TEMP/$ARCHIVE" --ignore-scripts --no-audit --no-fund
          test ! -e "$RUNNER_TEMP/isolated-synnergyze/node_modules/algoliasearch"
          export SYNNERGYZE_MCP_SERVER_PATH="$RUNNER_TEMP/isolated-synnergyze/node_modules/@believers-common-group/synnergyze-discovery-mcp/server.mjs"
          test -f "$SYNNERGYZE_MCP_SERVER_PATH"
          node --test apps/synnergyze-discovery-mcp-r01/discovery.node-check.mjs
