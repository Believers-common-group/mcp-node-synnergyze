name: live-runtime-verify

on:
  push:
    branches: [ops/env-refresh-2026-08-13]
    paths:
      - .github/workflows/live-runtime-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify health
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/health'
          body=$(curl -fsS "$endpoint")
          printf '%s\n' "$body" | jq .
          printf '%s' "$body" | jq -e '.ok == true and .service == "synnergyze-genesis-mcp"' >/dev/null
          echo 'health=PASS'

      - name: Initialize MCP
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/mcp'
          payload='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"github-live-verifier","version":"1.0.0"}}}'
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "$endpoint" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' --data "$payload")
          echo "mcp_initialize_http=$code"
          jq . "$tmp"
          test "$code" = '200'
          jq -e '.result.serverInfo.name == "synnergyze-genesis-mcp"' "$tmp" >/dev/null
          echo 'mcp_initialize=PASS'

      - name: Verify Genesis status
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/mcp'
          payload='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"genesis_status","arguments":{}}}'
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "$endpoint" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-03-26' --data "$payload")
          echo "genesis_status_http=$code"
          jq . "$tmp"
          test "$code" = '200'
          text=$(jq -r '.result.content[]? | select(.type=="text") | .text' "$tmp" | head -n1)
          printf '%s' "$text" | jq -e '.supabase.configured == true and .supabase.urlConfigured == true and .supabase.publishableKeyConfigured == true' >/dev/null
          echo 'genesis_status=PASS'

      - name: Probe Supabase read-only
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/mcp'
          payload='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"genesis_supabase_probe","arguments":{}}}'
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "$endpoint" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-03-26' --data "$payload")
          echo "supabase_probe_http=$code"
          jq . "$tmp"
          test "$code" = '200'
          text=$(jq -r '.result.content[]? | select(.type=="text") | .text' "$tmp" | head -n1)
          printf '%s' "$text" | jq -e '.ok == true and .configured == true' >/dev/null
          echo 'supabase_probe=PASS'

      - name: Verify bridge rejects wrong bearer
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/registry-bridge?limit=1'
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' "$endpoint" -H 'Authorization: Bearer deliberately-wrong-verification-token')
          echo "bridge_wrong_bearer_http=$code"
          jq . "$tmp"
          test "$code" = '401'
          jq -e '.ok == false and .error == "unauthorized"' "$tmp" >/dev/null
          echo 'bridge_wrong_bearer=PASS'
