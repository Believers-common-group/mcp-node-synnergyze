name: ESO-61 dependency lock fix

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/eso-61-dependency-lock-fix.yml

permissions:
  contents: write

jobs:
  remediate-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/eso-61-b003-license-metadata'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Apply non-breaking audit fixes to lock only
        run: |
          set +e
          npm audit fix --package-lock-only --ignore-scripts
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "npm audit fix failed unexpectedly with exit code $status"
            exit "$status"
          fi
          echo "npm audit fix completed; exit code $status may reflect residual vulnerabilities that require explicit disposition."

      - name: Prove package manifest was not rewritten
        run: git diff --exit-code -- package.json

      - name: Commit patched lock if needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile remediation available inside declared semver ranges'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(ESO-61): apply non-breaking dependency security fixes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
