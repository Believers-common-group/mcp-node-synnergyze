name: Synnergyze Connected Workspace R0.5 — local-only

on:
  pull_request:
    paths:
      - 'apps/synnergyze-workspace-r05/**'
      - '.github/workflows/synnergyze-workspace-r05.yml'

permissions:
  contents: read

jobs:
  node-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout (do not persist repository credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check local backend and browser script syntax
        run: |
          node --check apps/synnergyze-workspace-r05/server.mjs
          node --check apps/synnergyze-workspace-r05/public/app.js
      - name: Test HTTP lifecycle, isolation, reload and storage permissions
        run: node --test apps/synnergyze-workspace-r05/workspace.node-check.mjs
