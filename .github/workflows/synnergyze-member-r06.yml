name: Synnergyze Member Workspace R0.6 — Local SQLite

on:
  pull_request:
    paths:
      - 'apps/synnergyze-member-r06/**'
      - '.github/workflows/synnergyze-member-r06.yml'

permissions:
  contents: read

jobs:
  local-member-security-and-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check apps/synnergyze-member-r06/server.mjs
          node --check apps/synnergyze-member-r06/public/app.js
      - name: Test member isolation, session guards and SQLite persistence
        run: node --test apps/synnergyze-member-r06/member.node-check.mjs
