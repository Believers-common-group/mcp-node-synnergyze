name: Synnergyze Collaboration R0.4 — synthetic-only

on:
  pull_request:
    paths:
      - 'sandbox/synnergyze-collaboration-r04/**'
      - '.github/workflows/synnergyze-collaboration-r04.yml'

permissions:
  contents: read

jobs:
  synthetic-collaboration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run synthetic-only Node built-in tests
        run: node --test sandbox/synnergyze-collaboration-r04/pilot.test.mjs
      - name: Verify synthetic demo produces no real effect
        run: |
          node sandbox/synnergyze-collaboration-r04/demo.mjs > synthetic-demo.json
          node -e "const fs = require('fs'); const r = JSON.parse(fs.readFileSync('synthetic-demo.json')); if (r.exportResult.externalEffects !== false || r.stats.realExternalEffects !== 0 || r.ledgerValid !== true) process.exit(1);"
