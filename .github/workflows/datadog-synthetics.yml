# PR runs remain optional because fork/automation contexts may not receive secrets.
# Acceptance runs must use workflow_dispatch with require_execution=true.

name: Datadog Synthetic capability

on:
  push:
    branches: [ "genesis" ]
  pull_request:
    branches: [ "genesis" ]
  workflow_dispatch:
    inputs:
      require_execution:
        description: Fail unless Datadog Synthetic tests actually execute
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  datadog-synthetics:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Check Datadog credentials
        id: datadog-credentials
        shell: bash
        run: |
          if [[ -n "$DD_API_KEY" && -n "$DD_APP_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Datadog Synthetic tests
        id: datadog-synthetics
        if: steps.datadog-credentials.outputs.available == 'true'
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ env.DD_API_KEY }}
          app_key: ${{ env.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'

      - name: Record skipped PR capability check
        if: steps.datadog-credentials.outputs.available != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "::notice::Datadog Synthetic tests were NOT EXECUTED because credentials are unavailable."
          echo "## Datadog Synthetic acceptance" >> "$GITHUB_STEP_SUMMARY"
          echo "- Executed: **no**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: DD_API_KEY/DD_APP_KEY unavailable to this run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Acceptance status: **unverified**" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce dispatched acceptance execution
        if: github.event_name == 'workflow_dispatch' && inputs.require_execution && steps.datadog-credentials.outputs.available != 'true'
        run: |
          echo "::error::Acceptance execution required, but DD_API_KEY/DD_APP_KEY are unavailable."
          exit 1

      - name: Record executed acceptance check
        if: steps.datadog-credentials.outputs.available == 'true'
        run: |
          echo "## Datadog Synthetic acceptance" >> "$GITHUB_STEP_SUMMARY"
          echo "- Executed: **yes**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: **passed**" >> "$GITHUB_STEP_SUMMARY"
