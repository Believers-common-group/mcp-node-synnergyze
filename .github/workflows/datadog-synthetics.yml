# This workflow runs canonical Datadog Synthetic tests after changes land on main.
#
# Rationale:
# - The Datadog action requires DD_API_KEY and DD_APP_KEY.
# - Pull-request runs cannot be assumed to receive those protected secrets.
# - Running the secret-dependent job on every PR creates predictable failures and
#   unnecessary hosted-runner usage without improving contributor isolation.
# - Independent contributor projects and ordinary PR validation remain unaffected;
#   lint, type-check and test workflows continue to provide non-privileged checks.

name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Datadog Synthetic tests
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'
