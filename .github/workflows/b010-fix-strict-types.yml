name: B-010 fix strict site handoff types

on:
  push:
    branches:
      - fix/b010-governed-site-handoff-v2
    paths:
      - .github/workflows/b010-fix-strict-types.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/b010-governed-site-handoff-v2
          fetch-depth: 0

      - name: Repair strict handoff typings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('site-handoff/governed-runtime.ts')
          text = runtime.read_text()
          pattern = re.compile(
              r'if \(current\.state === "COMPLETED" && current\.result\) \{\s*'
              r'return \{ state: "COMPLETED", result: \{ \.\.\.current\.result \} \};\s*'
              r'\}\s*return \{ state: current\.state \};'
          )
          replacement = '''if (current.state === "COMPLETED" && current.result) {
              return { state: "COMPLETED", result: { ...current.result } };
            }
            if (current.state === "IN_PROGRESS") return { state: "IN_PROGRESS" };
            return { state: "FAILED" };'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'journal return repair count={count}')
          runtime.write_text(text)

          test = Path('site-handoff/governed-runtime.test.ts')
          t = test.read_text()
          import_anchor = '  type DestinationSessionReceiptV1,\n'
          if '  type HandoffClaimsV2,\n' not in t:
              if import_anchor not in t:
                  raise SystemExit('test import anchor not found')
              t = t.replace(import_anchor, import_anchor + '  type HandoffClaimsV2,\n', 1)

          dest_pattern = re.compile(
              r'async openSession\(input: \{\s*'
              r'claims: \{ digitalme_id: string; dst: "BC" \| "CC" \| "VSR"; capabilities: string\[\] \};\s*'
              r'roles: readonly string\[\];\s*createdAt: string;\s*'
              r'\}\): Promise<DestinationSessionReceiptV1> \{'
          )
          dest_replacement = '''async openSession(input: {
              handoffRef: string;
              reservationRef: string;
              claims: HandoffClaimsV2;
              roles: readonly string[];
              idempotencyKey: string;
              createdAt: string;
            }): Promise<DestinationSessionReceiptV1> {'''
          t, dest_count = dest_pattern.subn(dest_replacement, t, count=1)
          if dest_count != 1:
              raise SystemExit(f'RecordingDestination repair count={dest_count}')

          verify_pattern = re.compile(
              r'async verify\(input: \{\s*'
              r'claims: \{ digitalme_id: string; dst: "BC" \| "CC" \| "VSR"; capabilities: string\[\] \};\s*'
              r'session: DestinationSessionReceiptV1;\s*checkedAt: string;\s*'
              r'\}\) \{'
          )
          verify_replacement = '''async verify(input: {
              handoffRef: string;
              claims: HandoffClaimsV2;
              session: DestinationSessionReceiptV1;
              checkedAt: string;
            }) {'''
          t, verify_count = verify_pattern.subn(verify_replacement, t, count=1)
          if verify_count != 1:
              raise SystemExit(f'ExactSessionVerifier repair count={verify_count}')
          test.write_text(t)
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-handoff/governed-runtime.ts site-handoff/governed-runtime.test.ts
          git commit -m 'Fix governed handoff strict interface typings'
          git push origin HEAD:fix/b010-governed-site-handoff-v2
