name: live-mcp-verify

on:
  push:
    branches: [genesis]
    paths:
      - .github/workflows/live-mcp-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          url='https://synnergyze-genesis-mcp.vercel.app/health'
          for i in {1..18}; do
            body=$(curl -fsS "$url" 2>/dev/null || true)
            if printf '%s' "$body" | jq -e '.ok == true and .service == "synnergyze-genesis-mcp"' >/dev/null 2>&1; then
              echo "health=PASS"
              printf '%s\n' "$body" | jq '{ok,service,runtime}'
              exit 0
            fi
            sleep 5
          done
          echo 'health=FAIL'
          exit 1

      - name: Initialize MCP
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/mcp'
          payload='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"github-live-verifier","version":"1.0.0"}}}'
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "$endpoint" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data "$payload")
          echo "mcp_initialize_http=$code"
          cat "$tmp" | jq .
          test "$code" = "200"
          jq -e '.result.serverInfo.name == "synnergyze-genesis-mcp"' "$tmp" >/dev/null
          echo 'mcp_initialize=PASS'

      - name: Read Genesis status
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/mcp'
          payload='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"genesis_status","arguments":{}}}'
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "$endpoint" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'mcp-protocol-version: 2025-03-26' \
            --data "$payload")
          echo "genesis_status_http=$code"
          cat "$tmp" | jq .
          if [ "$code" = "200" ]; then echo 'genesis_status_request=PASS'; else echo 'genesis_status_request=FAIL'; fi

      - name: Probe Supabase read-only
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/mcp'
          payload='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"genesis_supabase_probe","arguments":{}}}'
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "$endpoint" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'mcp-protocol-version: 2025-03-26' \
            --data "$payload")
          echo "supabase_probe_http=$code"
          cat "$tmp" | jq .
          echo 'supabase_probe_completed=true'
