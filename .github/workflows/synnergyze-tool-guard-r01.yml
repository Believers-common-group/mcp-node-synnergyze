name: Synnergyze MCP Tool Guard R0.1 — offline contract checks

on:
  pull_request:
    paths:
      - 'apps/synnergyze-tool-guard-r01/**'
      - '.github/workflows/synnergyze-tool-guard-r01.yml'

permissions:
  contents: read

jobs:
  offline-tool-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check apps/synnergyze-tool-guard-r01/guard.mjs
          node --check apps/synnergyze-tool-guard-r01/guard.node-check.mjs
      - name: Offline validation and no-repeat regression suite
        run: node --test apps/synnergyze-tool-guard-r01/guard.node-check.mjs
