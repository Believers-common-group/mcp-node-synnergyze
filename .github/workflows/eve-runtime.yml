name: eve-runtime

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - "eve-runtime/**"
      - ".github/workflows/eve-runtime.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eve-runtime

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Build Eve runtime
        run: npm run build
