name: live-neon-persistence-verify

on:
  push:
    branches: [ops/env-refresh-2026-08-13]
    paths:
      - .github/workflows/live-neon-persistence-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Initialize MCP v0.2
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/mcp'
          payload='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"github-live-verifier","version":"1.0.0"}}}'
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "$endpoint" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' --data "$payload")
          echo "mcp_initialize_http=$code"
          test "$code" = '200'
          jq -e '.result.serverInfo.name == "synnergyze-genesis-mcp" and .result.serverInfo.version == "0.2.0"' "$tmp" >/dev/null
          echo 'mcp_initialize=PASS'

      - name: Verify persistence authority status
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/mcp'
          payload='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"genesis_status","arguments":{}}}'
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "$endpoint" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-03-26' --data "$payload")
          test "$code" = '200'
          text=$(jq -r '.result.content[]? | select(.type=="text") | .text' "$tmp" | head -n1)
          printf '%s' "$text" | jq -e '
            .authorityBoundary.canonicalState == "ALPHA-NODE-001 local Registry" and
            .authorityBoundary.policyAuthority == "Warden" and
            .authorityBoundary.neon == "runtime_projection_only" and
            .supabase.required == false and
            .supabase.mode == "deferred_optional" and
            .neonProjection.required == true and
            .neonProjection.configured == true and
            .neonProjection.cwrRegistryConfigured == true and
            .neonProjection.vsrPublicConfigured == true' >/dev/null
          echo 'persistence_authority_status=PASS'

      - name: Probe Neon projections read-only
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/mcp'
          payload='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"genesis_neon_projection_probe","arguments":{}}}'
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "$endpoint" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-03-26' --data "$payload")
          test "$code" = '200'
          text=$(jq -r '.result.content[]? | select(.type=="text") | .text' "$tmp" | head -n1)
          printf '%s' "$text" | jq -e '.ok == true and .required == true and .configured == true and .cwrRegistryReachable == true and .vsrPublicReachable == true' >/dev/null
          echo 'neon_projection_probe=PASS'

      - name: Confirm Supabase is non-blocking
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/mcp'
          payload='{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"genesis_supabase_probe","arguments":{}}}'
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "$endpoint" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-03-26' --data "$payload")
          test "$code" = '200'
          text=$(jq -r '.result.content[]? | select(.type=="text") | .text' "$tmp" | head -n1)
          printf '%s' "$text" | jq -e '.required == false and .deferred == true' >/dev/null
          echo 'supabase_nonblocking=PASS'

      - name: Verify bridge fail-closed auth
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/registry-bridge?limit=1'
          noauth=$(curl -sS -o /tmp/noauth -w '%{http_code}' "$endpoint")
          wrong=$(curl -sS -o /tmp/wrong -w '%{http_code}' "$endpoint" -H 'Authorization: Bearer deliberately-wrong-verification-token')
          test "$noauth" = '401'
          test "$wrong" = '401'
          jq -e '.ok == false and .error == "unauthorized"' /tmp/noauth >/dev/null
          jq -e '.ok == false and .error == "unauthorized"' /tmp/wrong >/dev/null
          echo 'bridge_auth=PASS'
