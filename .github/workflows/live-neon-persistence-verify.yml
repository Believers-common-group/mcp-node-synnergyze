name: live-neon-persistence-verify

on:
  push:
    branches: [ops/env-refresh-2026-08-13]
    paths:
      - .github/workflows/live-neon-persistence-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect non-secret runtime status
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://synnergyze-genesis-mcp.vercel.app/mcp'

          call_tool() {
            id="$1"
            tool="$2"
            payload=$(printf '{"jsonrpc":"2.0","id":%s,"method":"tools/call","params":{"name":"%s","arguments":{}}}' "$id" "$tool")
            tmp=$(mktemp)
            code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "$endpoint" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-03-26' --data "$payload")
            echo "${tool}_http=$code"
            jq . "$tmp"
          }

          call_tool 2 genesis_status
          call_tool 3 genesis_neon_projection_probe
          call_tool 4 genesis_supabase_probe

          bridge='https://synnergyze-genesis-mcp.vercel.app/registry-bridge?limit=1'
          noauth=$(curl -sS -o /tmp/noauth -w '%{http_code}' "$bridge")
          wrong=$(curl -sS -o /tmp/wrong -w '%{http_code}' "$bridge" -H 'Authorization: Bearer deliberately-wrong-verification-token')
          echo "bridge_noauth_http=$noauth"
          echo "bridge_wrong_http=$wrong"
          jq . /tmp/noauth
          jq . /tmp/wrong
