schema: vsr.repository-components/v1
repository: Believers-common-group/mcp-node-synnergyze
primary_network_object: SYNNERGYZE-RUNTIME-001
module_binding_ref: .vsr/module-bindings.yaml
canonical_governance:
  repository: Believers-common-group/SynergyzeGovernance
  refs:
    - issue:13
    - issue:19
    - issue:20
    - issue:34
    - issue:35
    - issue:36
    - issue:38
    - issue:39
    - issue:40
    - issue:41

components:
  - component_id: CMP-SYNNERGYZE-PROGRAM-EVENT-001
    network_object: SYNNERGYZE-RUNTIME-001
    role: qel-program-event-planning-compiler
    state: conformance_implemented
    implementation_path: modules/synnergyze/program-bridge.ts
    contract_path: modules/synnergyze/contracts.ts
    input_contracts:
      - NormalizedIntentV1
      - ProgramPlanDraftV1
      - SynnergyzeProgramCompileRequestV1
    output_contracts:
      - SynnergyzeProgramDraftV1
      - SynnergyzeEventDraftV1
      - SynnergyzeProgramEventDraftBundleV1
      - SynnergyzeProgramCompileResultV1
    planning_states:
      - DRAFT
      - READY_FOR_RESOLUTION
      - BLOCKED_REQUIREMENT
      - READY_FOR_AUTHORIZATION
    forbidden_states:
      - AUTHORIZED
      - RUNNING
      - VERIFIED
      - EFFECT_RECORDED
      - SETTLED
      - CLOSED
    depends_on:
      - QEL-3-001
      - REGISTRY-CONTEXT-REFS
    downstream_boundaries:
      - WARDEN-RUNTIME-001
      - RIVEROS-001
      - BNR-RUNTIME-001
      - SILK-DAM-001
      - SILK-001
    forbidden:
      - call-warden-or-issue-action-token
      - reserve-or-seal-river-evidence
      - execute-connector-capability
      - mark-effect-verified
      - create-economic-obligation
      - imply-settlement-finality
    tests:
      - modules/synnergyze/program-bridge.test.ts
    activation_gate: integration-with-explicit-warden-and-river-boundaries
    activation_implied: false

  - component_id: CMP-SYNNERGYZE-WARDEN-REQUEST-001
    network_object: SYNNERGYZE-RUNTIME-001
    role: prepared-event-to-warden-request-adapter
    state: conformance_implemented
    implementation_path: modules/synnergyze/warden-request-bridge.ts
    contract_paths:
      - modules/synnergyze/contracts.ts
      - modules/warden/contracts.ts
    identity_invariant:
      - actor-is-not-represented-principal
      - represented-principal-is-not-acting-capacity
      - acting-capacity-is-not-authority
      - device-security-state-is-not-warden-authority
    input_contracts:
      - SynnergyzeProgramDraftV1
      - SynnergyzeEventDraftV1
      - ResolvedRepresentationContextV1
      - ResolvedDeviceSecurityContextV1
      - WardenRequestBridgeInputV1
    output_contracts:
      - WardenDecisionRequestV1
      - WardenRequestBridgeResultV1
    depends_on:
      - CMP-SYNNERGYZE-PROGRAM-EVENT-001
      - REGISTRY-REPRESENTATION-RESOLUTION
      - REGISTRY-DEVICE-SECURITY-RESOLUTION
      - WARDEN-RUNTIME-001-CONTRACT
      - BAG-LOCK-001
    downstream_boundaries:
      - WARDEN-RUNTIME-001
    required_request_fields:
      - actorRef
      - representedPrincipalRef
      - actingCapacityRef
      - contextRef
      - programRef
      - eventRef
      - action
      - capabilityRef
      - targetRef
      - representationSourceRefs
      - correlationId
    conditional_device_guards:
      - device-bound-event-requires-security-resolution
      - exact-device-reference-match
      - device-state-active-before-warden-request
      - security-resolution-and-evidence-required
      - security-resolution-not-future-or-expired
      - security-evidence-bound-into-request-identity
    forbidden:
      - infer-represented-principal-from-actor
      - infer-acting-capacity-from-ui-or-provider-state
      - authorize-device-bound-event-with-unresolved-or-non-active-device-security
      - evaluate-warden-policy
      - issue-action-token
      - reserve-or-seal-river-evidence
      - execute-connector-capability
      - mark-effect-verified
      - create-economic-obligation
      - imply-settlement-finality
    tests:
      - modules/synnergyze/warden-request-bridge.test.ts
      - modules/rc1-adapters.test.ts
    activation_gate: integration-with-real-warden-decision-boundary
    activation_implied: false

  - component_id: CMP-SYNNERGYZE-CONTROLLED-EXECUTION-001
    network_object: SYNNERGYZE-RUNTIME-001
    role: reserved-authorized-action-to-synthetic-execution
    state: conformance_implemented
    implementation_path: modules/synnergyze/execution-gate.ts
    contract_paths:
      - modules/synnergyze/contracts.ts
      - modules/warden/contracts.ts
      - modules/river/contracts.ts
    input_contracts:
      - ActionEnvelopeV1
      - EvidenceReservationV1
      - WardenDecisionV1
      - WardenExecutionCheckpointV1
      - ResolvedDeviceSecurityContextV1
      - ControlledExecutionRequestV1
    output_contracts:
      - SynnergyzeExecutionReceiptV1
    execution_states:
      - EXECUTED_UNVERIFIED
    depends_on:
      - WARDEN-RUNTIME-001
      - RIVEROS-001
      - CMP-SYNNERGYZE-WARDEN-REQUEST-001
      - BAG-LOCK-001
    adapter_allowlist:
      - SYNTHETIC-SERVICE-REQUEST-ADAPTER-001
    required_guards:
      - warden-allow-and-action-token
      - decision-validity-window
      - fresh-warden-execution-checkpoint
      - reservation-action-decision-correlation-match
      - reservation-authorization-digest-match
      - request-time-device-security-binding-if-device-bound
      - fresh-device-security-recheck-if-device-bound
      - device-security-device-and-policy-match
      - device-security-active-and-evidenced-at-execution
      - device-security-time-validity-at-execution
      - capability-adapter-registration
      - idempotent-execution-replay
    forbidden:
      - execute-non-allow-decision
      - execute-revoked-expired-or-superseded-checkpoint
      - execute-without-river-reservation
      - execute-device-bound-action-with-missing-stale-mismatched-or-non-active-device-security
      - claim-hardware-port-or-radio-enforcement
      - execute-unregistered-capability
      - create-effect-receipt
      - mark-effect-verified
      - seal-river-evidence
      - mutate-registry-effect
      - create-economic-obligation
      - imply-settlement-finality
      - invoke-real-external-provider
    tests:
      - modules/synnergyze/execution-gate.test.ts
      - modules/synnergyze/warden-request-bridge.test.ts
      - modules/river/reservation-service.test.ts
      - modules/warden/decision-service.test.ts
    activation_gate: explicit-controlled-connector-integration-and-authorization
    activation_implied: false

  - component_id: CMP-SYNNERGYZE-EFFECT-VERIFY-001
    network_object: SYNNERGYZE-RUNTIME-001
    role: executed-unverified-to-observed-verified-effect
    state: conformance_implemented
    implementation_path: modules/synnergyze/effect-verification.ts
    contract_paths:
      - modules/synnergyze/effect-verification.ts
      - modules/synnergyze/contracts.ts
      - modules/river/contracts.ts
    input_contracts:
      - SynnergyzeExecutionReceiptV1
      - PostExecutionObservationV1
    output_contracts:
      - VerifiedEffectV1
      - EffectVerificationResultV1
    verification_states:
      - VERIFIED_EFFECT
      - EXCEPTION
    depends_on:
      - CMP-SYNNERGYZE-CONTROLLED-EXECUTION-001
      - RIVEROS-001-CONTRACT
    observation_source_allowlist:
      - SYNTHETIC-SERVICE-REQUEST-OBSERVER-001
    required_guards:
      - execution-state-executed-unverified
      - exact-execution-observation-lineage
      - action-program-event-target-correlation-match
      - observation-not-before-execution
      - verification-not-before-observation
      - observed-state-present
      - source-evidence-present
      - idempotent-verification-replay
      - conflicting-replay-fails-closed
    forbidden:
      - infer-effect-from-requested-effect
      - infer-effect-from-adapter-success-alone
      - seal-river-evidence
      - mutate-registry-effect
      - close-objective
      - create-economic-obligation
      - imply-settlement-finality
      - invoke-real-external-provider
    tests:
      - modules/synnergyze/effect-verification.test.ts
    downstream_boundary: river-seal-to-registry-effect-to-objective-acceptance
    activation_gate: post-execution-observation-and-effect-verification-conformance-only
    activation_implied: false

  - component_id: CMP-SYNNERGYZE-OBJECTIVE-INVENTORY-001
    network_object: SYNNERGYZE-RUNTIME-001
    role: governed-objective-to-synthetic-inventory-transfer-acceptance
    state: conformance_implemented
    implementation_path: modules/objective/inventory-transfer.ts
    contract_paths:
      - modules/objective/contracts.ts
      - modules/warden/contracts.ts
      - modules/river/contracts.ts
      - modules/synnergyze/contracts.ts
      - modules/synnergyze/effect-verification.ts
    purpose_lineage:
      - PRINCIPAL
      - OBJECTIVE
      - AUTHORITY
      - PROGRAM
      - EVENT
      - EXECUTION
      - EVIDENCE
      - EFFECT
      - ACCEPTANCE
    input_contracts:
      - ObjectiveRefV1
      - ObjectiveAuthorityEnvelopeV1
      - InventoryTransferSpecV1
    output_contracts:
      - ObjectiveProgramBundleV1
      - ObjectiveEffectV1
      - AcceptanceResultV1
      - InventoryTransferProofV1
    depends_on:
      - CMP-SYNNERGYZE-CONTROLLED-EXECUTION-001
      - CMP-SYNNERGYZE-EFFECT-VERIFY-001
      - WARDEN-RUNTIME-001
      - RIVEROS-001
    capability_allowlist:
      - inventory.transfer
    required_guards:
      - objective-authorized-and-in-window
      - explicit-principal-actor-capacity-context
      - explicit-resource-scope
      - fresh-warden-action-decision
      - river-reservation-before-execution
      - fresh-warden-execution-checkpoint
      - post-execution-read-after-write-observation
      - effect-verification-before-river-seal
      - river-seal-before-objective-effect-record
      - purpose-lineage-on-every-program-event-effect
      - duplicate-effect-rejection
      - front-back-projection-equivalence
      - acceptance-only-from-observed-sealed-effects
    forbidden:
      - infer-objective-authority-from-model-or-agent
      - infer-effect-from-intended-outcome
      - accept-without-sealed-evidence
      - duplicate-effect-on-replay
      - provider-or-database-authority
      - real-external-inventory-write
      - create-financial-or-legal-effect
      - create-economic-obligation
      - imply-settlement-finality
      - activate-real-location-canary
    tests:
      - modules/objective/inventory-transfer.test.ts
      - modules/synnergyze/execution-gate.test.ts
      - modules/synnergyze/effect-verification.test.ts
    activation_gate: synthetic-objective-proof-only-real-canary-separately-authorized
    activation_implied: false
